<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spaced Repetition Tracker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --bg-card: #1a1d27;
  --bg-hover: #22262f;
  --bg-input: #14161e;
  --border: #2a2e3a;
  --text: #e4e6eb;
  --text-dim: #8b8fa3;
  --accent: #6c63ff;
  --accent-hover: #5a52e0;
  --success: #22c55e;
  --success-dim: #166534;
  --fail: #ef4444;
  --fail-dim: #7f1d1d;
  --warn: #f59e0b;
  --warn-dim: #78350f;
  --overdue: #ef4444;
  --due-today: #f59e0b;
  --due-soon: #3b82f6;
  --mastered: #22c55e;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
}

[data-theme="light"] {
  --bg: #f5f5f7;
  --bg-card: #ffffff;
  --bg-hover: #f0f0f2;
  --bg-input: #f8f8fa;
  --border: #d4d4d8;
  --text: #1a1a2e;
  --text-dim: #6b7280;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}

html { font-size: 15px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  transition: background 0.3s, color 0.3s;
}

/* Header */
.header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0.8rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 1.15rem; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
.header-right { display: flex; align-items: center; gap: 0.7rem; }
.header-actions { display: flex; gap: 0.4rem; align-items: center; }
.icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 34px; height: 34px;
  border-radius: var(--radius);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  transition: all 0.15s;
  position: relative;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--accent); }

.container { max-width: 800px; margin: 0 auto; padding: 1rem; }

/* Streak badge */
.streak-badge {
  font-size: 0.7rem;
  color: var(--warn);
  font-weight: 600;
  display: flex; align-items: center; gap: 0.2rem;
}

/* Sync Profile button */
.btn-sync-profile {
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  padding: 0.4rem 0.7rem;
  font-weight: 600;
  font-size: 0.72rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.btn-sync-profile:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-sync-profile:active { transform: translateY(0); }

/* Notification badge */
.notif-badge {
  position: absolute;
  top: -2px; right: -2px;
  width: 8px; height: 8px;
  background: var(--fail);
  border-radius: 50%;
  border: 2px solid var(--bg-card);
  display: none;
}
.notif-badge.show { display: block; }

/* View toggle */
.view-toggle { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
.view-btn {
  padding: 0.4rem 0.8rem; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-dim); cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: all 0.15s;
}
.view-btn:hover { border-color: var(--accent); color: var(--text); }
.view-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Stats row */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin-bottom: 1rem; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.7rem; text-align: center; transition: transform 0.2s, box-shadow 0.2s; }
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.stat-num { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.stat-overdue .stat-num { color: var(--overdue); }
.stat-today .stat-num { color: var(--due-today); }
.stat-soon .stat-num { color: var(--due-soon); }
.stat-mastered .stat-num { color: var(--mastered); }

/* Subject stats bar with progress */
.subject-stats { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
.subject-stat {
  display: flex; align-items: center; gap: 0.35rem;
  padding: 0.3rem 0.6rem; border-radius: 6px;
  background: var(--bg-card); border: 1px solid var(--border);
  font-size: 0.7rem; color: var(--text-dim);
  transition: transform 0.15s;
}
.subject-stat:hover { transform: translateY(-1px); }
.subject-stat .ss-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.subject-stat .ss-count { font-weight: 600; color: var(--text); }
.subject-stat .ss-progress { width: 40px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.subject-stat .ss-progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
.tab {
  padding: 0.45rem 0.8rem; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-dim); cursor: pointer; font-size: 0.8rem; font-weight: 500;
  white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 0.4rem;
}
.tab:hover { border-color: var(--accent); color: var(--text); transform: translateY(-1px); }
.tab.active { color: #fff; }
.tab .color-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tab .count { display: inline-block; background: rgba(255,255,255,0.15); padding: 0 0.4rem; border-radius: 8px; font-size: 0.7rem; }
.tab.active .count { background: rgba(255,255,255,0.25); }
.tab-del { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; font-size: 0.75rem; line-height: 1; margin-left: 2px; opacity: 0.5; transition: all 0.15s; }
.tab-del:hover { opacity: 1; background: rgba(239,68,68,0.8); color: #fff; }

/* Search */
.search-row { margin-bottom: 1rem; }
.search-input {
  width: 100%; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0.5rem 0.75rem; color: var(--text);
  font-size: 0.85rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }

/* Section headers */
.section-header {
  font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-dim); margin: 1.2rem 0 0.5rem; display: flex; align-items: center; gap: 0.5rem;
}
.section-header .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.section-header.overdue .dot { background: var(--overdue); }
.section-header.today .dot { background: var(--due-today); }
.section-header.soon .dot { background: var(--due-soon); }
.section-header.later .dot { background: var(--text-dim); }
.section-header.mastered .dot { background: var(--mastered); }

/* Topic cards with animations */
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes cardExit {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(0.95) translateX(20px); }
}
.topic-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0.75rem 0.9rem; margin-bottom: 0.5rem;
  display: flex; align-items: center; gap: 0.7rem;
  transition: all 0.2s;
  animation: cardEnter 0.3s ease-out backwards;
}
.topic-card:hover { border-color: #3a3e4a; transform: translateX(3px); }
.topic-card.overdue { border-left: 3px solid var(--overdue); }
.topic-card.due-today { border-left: 3px solid var(--due-today); }
.topic-card.due-soon { border-left: 3px solid var(--due-soon); }
.topic-card.mastered-card { border-left: 3px solid var(--mastered); opacity: 0.8; }
.topic-card.removing { animation: cardExit 0.3s ease-in forwards; pointer-events: none; }
.topic-info { flex: 1; min-width: 0; }
.topic-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topic-meta { font-size: 0.75rem; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; margin-top: 0.15rem; }
.topic-subject { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; color: #fff; }
.topic-notes { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-style: italic; }
.level-pips { display: flex; gap: 3px; align-items: center; }
.pip { width: 8px; height: 8px; border-radius: 2px; background: var(--border); transition: background 0.2s; }
.pip.filled { background: var(--accent); }
.pip.mastered-pip { background: var(--mastered); }

/* Action buttons */
.topic-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
.btn-pass, .btn-fail, .btn-del, .btn-edit {
  border: none; border-radius: 6px; cursor: pointer;
  font-size: 0.78rem; font-weight: 600; padding: 0.4rem 0.65rem;
  transition: all 0.2s;
}
.btn-pass { background: var(--success-dim); color: var(--success); }
.btn-pass:hover { background: var(--success); color: #fff; transform: scale(1.05); }
.btn-fail { background: var(--fail-dim); color: var(--fail); }
.btn-fail:hover { background: var(--fail); color: #fff; transform: scale(1.05); }
.btn-edit { background: transparent; color: var(--text-dim); padding: 0.4rem; font-size: 0.85rem; }
.btn-edit:hover { color: var(--accent); }
.btn-del { background: transparent; color: var(--text-dim); padding: 0.4rem; font-size: 0.9rem; }
.btn-del:hover { color: var(--fail); }

/* Add topic area */
.add-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem; margin-bottom: 1rem; }
.add-row { display: flex; gap: 0.5rem; }
.add-input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.75rem; color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
.add-input:focus { border-color: var(--accent); }
.add-select { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.75rem; color: var(--text); font-size: 0.85rem; outline: none; cursor: pointer; min-width: 120px; }
.add-select:focus { border-color: var(--accent); }
.btn-add { background: var(--accent); border: none; border-radius: 8px; color: #fff; padding: 0.55rem 1rem; font-weight: 600; font-size: 0.9rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.btn-add:hover { background: var(--accent-hover); transform: translateY(-1px); }
.add-subject-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
.btn-add-subject { background: transparent; border: 1px dashed var(--border); border-radius: 8px; color: var(--text-dim); padding: 0.4rem 0.75rem; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.btn-add-subject:hover { border-color: var(--accent); color: var(--accent); }

.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-dim); }
.empty-state .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); animation: modalEnter 0.2s ease-out; }
@keyframes modalEnter { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal h2 { font-size: 1.1rem; margin-bottom: 1rem; }
.modal label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.3rem; margin-top: 0.8rem; }
.modal input[type="text"], .modal select { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.75rem; color: var(--text); font-size: 0.9rem; outline: none; }
.modal input[type="text"]:focus, .modal select:focus { border-color: var(--accent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.2rem; }
.btn-secondary { background: var(--bg-hover); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer; transition: all 0.15s; }
.btn-secondary:hover { border-color: var(--text-dim); }
.btn-primary { background: var(--accent); border: none; border-radius: 8px; color: #fff; padding: 0.5rem 1rem; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--fail); border: none; border-radius: 8px; color: #fff; padding: 0.5rem 1rem; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
.btn-danger:hover { background: #dc2626; }

/* Color grid & subject list */
.color-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.4rem; }
.color-swatch { width: 28px; height: 28px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
.color-swatch:hover { transform: scale(1.15); }
.color-swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.subject-list { margin-top: 0.8rem; display: flex; flex-direction: column; gap: 0.5rem; max-height: 280px; overflow-y: auto; }

/* Subject edit inline */
.subject-edit-form { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.5rem 0.6rem; background: var(--bg-hover); border-radius: 6px; border: 1px solid var(--accent); animation: cardEnter 0.2s ease-out; }
.subject-edit-top { display: flex; gap: 0.4rem; align-items: center; }
.subject-edit-top input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; padding: 0.3rem 0.5rem; color: var(--text); font-size: 0.82rem; outline: none; }
.subject-edit-top input:focus { border-color: var(--accent); }
.subject-edit-colors { display: flex; flex-wrap: wrap; gap: 3px; }
.mini-swatch { width: 18px; height: 18px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; transition: all 0.1s; }
.mini-swatch:hover { transform: scale(1.15); }
.mini-swatch.selected { border-color: #fff; box-shadow: 0 0 0 1px var(--accent); }
.subject-edit-actions { display: flex; gap: 0.3rem; justify-content: flex-end; }
.subject-edit-actions button { padding: 0.25rem 0.6rem; font-size: 0.75rem; border-radius: 4px; cursor: pointer; font-weight: 600; border: none; transition: all 0.15s; }
.subject-edit-actions .btn-save-edit { background: var(--accent); color: #fff; }
.subject-edit-actions .btn-save-edit:hover { background: var(--accent-hover); }
.subject-edit-actions .btn-cancel-edit { background: var(--bg-input); color: var(--text-dim); border: 1px solid var(--border); }

/* Confirmation dialog */
.confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 250; align-items: center; justify-content: center; padding: 1rem; }
.confirm-overlay.open { display: flex; }
.confirm-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; max-width: 380px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.5); animation: modalEnter 0.2s ease-out; }
.confirm-box .confirm-icon { font-size: 2rem; text-align: center; margin-bottom: 0.5rem; }
.confirm-box .confirm-msg { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.4rem; text-align: center; }
.confirm-box .confirm-detail { font-size: 0.8rem; color: var(--text-dim); text-align: center; margin-bottom: 1.2rem; line-height: 1.5; }
.confirm-box .confirm-actions { display: flex; gap: 0.5rem; justify-content: center; }

/* Sync indicator */
.sync-status { font-size: 0.7rem; color: var(--text-dim); display: flex; align-items: center; gap: 0.3rem; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
.sync-dot.online { background: var(--success); }
.sync-dot.syncing { background: var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Toast */
.toast-container { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
.toast { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem 1rem; font-size: 0.85rem; box-shadow: var(--shadow); animation: slideUp 0.25s ease-out; white-space: nowrap; display: flex; align-items: center; gap: 0.6rem; }
.toast .undo-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 0.2rem 0.6rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Calendar (compact) */
.calendar-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.8rem; margin-bottom: 1rem; }
.calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
.calendar-nav button { background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 0.25rem 0.5rem; cursor: pointer; font-size: 0.8rem; transition: all 0.15s; }
.calendar-nav button:hover { border-color: var(--accent); color: var(--text); }
.calendar-nav .month-label { font-weight: 600; font-size: 0.9rem; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.calendar-day-header { text-align: center; font-size: 0.6rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; padding: 0.2rem 0; }
.calendar-day {
  min-height: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 4px; font-size: 0.7rem; color: var(--text-dim); position: relative;
  cursor: pointer; padding: 2px; transition: all 0.15s;
}
.calendar-day:hover { background: var(--bg-hover); }
.calendar-day.other-month { opacity: 0.3; pointer-events: none; }
.calendar-day.today-cell { border: 1px solid var(--accent); color: var(--text); }
.calendar-day.selected-day { background: var(--accent); color: #fff; }
.calendar-day .day-num { font-weight: 500; font-size: 0.7rem; }
.calendar-day .day-dots { display: flex; gap: 1px; margin-top: 1px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
.calendar-day .day-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }
.calendar-day .day-count { font-size: 0.5rem; background: var(--accent); border-radius: 3px; padding: 0 2px; margin-top: 1px; line-height: 1.3; color: #fff; }
.calendar-day-detail { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem 0.7rem; margin-top: 0.4rem; font-size: 0.8rem; animation: cardEnter 0.2s ease-out; }
.calendar-day-detail .detail-title { font-weight: 600; margin-bottom: 0.3rem; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
.calendar-day-detail .detail-item { display: flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0; }
.calendar-day-detail .detail-item .topic-subject { font-size: 0.6rem; padding: 0.05rem 0.35rem; }

/* Week view (compact) */
.calendar-mode-toggle { display: flex; gap: 0.3rem; }
.cal-mode-btn {
  padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid var(--border);
  background: transparent; color: var(--text-dim); cursor: pointer; font-size: 0.7rem; font-weight: 500; transition: all 0.15s;
}
.cal-mode-btn:hover { border-color: var(--accent); color: var(--text); }
.cal-mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.week-day-cell {
  min-height: 60px; padding: 0.35rem; border-radius: 6px;
  background: var(--bg-input); border: 1px solid transparent;
  cursor: pointer; transition: all 0.15s; font-size: 0.75rem;
}
.week-day-cell:hover { border-color: var(--border); background: var(--bg-hover); }
.week-day-cell.today-cell { border-color: var(--accent); }
.week-day-cell.selected-day { background: rgba(108,99,255,0.15); border-color: var(--accent); }
.week-day-cell .wk-date { font-weight: 600; font-size: 0.7rem; margin-bottom: 3px; color: var(--text-dim); }
.week-day-cell.today-cell .wk-date { color: var(--accent); }
.week-day-cell .wk-topic { font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; margin-bottom: 2px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Responsive */
@media (max-width: 500px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .add-row { flex-wrap: wrap; }

}

</style>
</head>
<body>

<header class="header">
  <h1>SR Tracker</h1>
  <div class="header-right">
    <div class="streak-badge" id="streakBadge" title="Review streak"></div>
    <div class="sync-status" id="syncStatus">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncLabel">Local</span>
    </div>
    <button class="btn-sync-profile" onclick="syncUserProfile()" title="Sync with cloud profile">&#9729; <span>Sync Profile</span></button>
    <div class="header-actions">
      <button class="icon-btn" id="notifBtn" onclick="toggleNotifications()" title="Notifications" aria-label="Notifications">&#128276;<span class="notif-badge" id="notifBadge"></span></button>
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">&#9789;</button>
      <button class="icon-btn" onclick="openSettings()" title="Settings" aria-label="Settings">&#9881;</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="stats-row">
    <div class="stat-card stat-overdue"><div class="stat-num" id="statOverdue">0</div><div class="stat-label">Overdue</div></div>
    <div class="stat-card stat-today"><div class="stat-num" id="statToday">0</div><div class="stat-label">Today</div></div>
    <div class="stat-card stat-soon"><div class="stat-num" id="statSoon">0</div><div class="stat-label">Soon</div></div>
    <div class="stat-card stat-mastered"><div class="stat-num" id="statMastered">0</div><div class="stat-label">Mastered</div></div>
  </div>

  <div class="subject-stats" id="subjectStats"></div>

  <div class="view-toggle">
    <button class="view-btn active" id="viewList" onclick="setView('list')">List</button>
    <button class="view-btn" id="viewCalendar" onclick="setView('calendar')">Calendar</button>
    <button class="view-btn" id="viewWeek" onclick="setView('week')">Week</button>
    <button class="view-btn" id="viewRoadmap" onclick="setView('roadmap')">Roadmap</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="search-row">
    <input class="search-input" id="searchInput" type="text" placeholder="Search topics..." aria-label="Search">
  </div>

  <div class="add-section">
    <div class="add-row">
      <input class="add-input" id="topicInput" type="text" placeholder="New topic name..." aria-label="Topic name">
      <select class="add-select" id="subjectSelect" aria-label="Subject"></select>
      <button class="btn-add" onclick="addTopic()">Add</button>
    </div>
    <div class="add-subject-row">
      <button class="btn-add-subject" onclick="openAddSubject()">+ Add Subject</button>
    </div>
  </div>

  <div id="calendarView" style="display:none;"></div>
  <div id="roadmapView" style="display:none;"></div>
  <div id="topicList"></div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>
    <label for="masterKeyInput">JSONBin Master Key</label>
    <input type="text" id="masterKeyInput" placeholder="$2a$10$...">
    <label for="accessKeyInput">JSONBin Access Key</label>
    <input type="text" id="accessKeyInput" placeholder="$2a$10$...">
    <label for="binIdInput">Bin ID (leave empty to create new)</label>
    <input type="text" id="binIdInput" placeholder="e.g. 64a1b2c3d4...">
    <div style="margin-top:0.8rem;">
      <label style="margin:0;"><input type="checkbox" id="autoSyncCheckbox" checked> <span style="font-size:0.85rem;color:var(--text);">Auto-sync on changes</span></label>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="exportData()">Export</button>
      <label class="btn-secondary" style="display:inline-flex;align-items:center;cursor:pointer;">Import<input type="file" accept=".json" style="display:none;" onchange="importData(event)"></label>
      <button class="btn-secondary" onclick="closeSettings()">Cancel</button>
      <button class="btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<!-- Manage Subjects Modal -->
<div class="modal-overlay" id="addSubjectModal">
  <div class="modal">
    <h2>Manage Subjects</h2>
    <label>Existing subjects</label>
    <div class="subject-list" id="subjectList"></div>
    <label for="subjectNameInput">New Subject Name</label>
    <input type="text" id="subjectNameInput" placeholder="e.g. Python, Math...">
    <label>Color</label>
    <div class="color-grid" id="colorGrid"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAddSubject()">Close</button>
      <button class="btn-primary" onclick="confirmAddSubject()">Add</button>
    </div>
  </div>
</div>

<!-- Edit Topic Modal -->
<div class="modal-overlay" id="editTopicModal">
  <div class="modal">
    <h2>Edit Topic</h2>
    <input type="hidden" id="editTopicId">
    <label for="editTopicName">Name</label>
    <input type="text" id="editTopicName">
    <label for="editTopicSubject">Subject</label>
    <select id="editTopicSubject"></select>
    <label for="editTopicNotes">Notes</label>
    <textarea id="editTopicNotes" rows="3" style="width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:0.55rem 0.75rem;color:var(--text);font-size:0.85rem;outline:none;resize:vertical;font-family:inherit;" placeholder="Study notes, links, context..."></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeEditTopic()">Cancel</button>
      <button class="btn-primary" onclick="saveEditTopic()">Save</button>
    </div>
  </div>
</div>

<!-- Confirmation Dialog -->
<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirmIcon">&#9888;</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-detail" id="confirmDetail"></div>
    <div class="confirm-actions">
      <button class="btn-secondary" onclick="confirmResolve(false)">Cancel</button>
      <button class="btn-danger" id="confirmOkBtn" onclick="confirmResolve(true)">Delete</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const DEFAULT_SUBJECTS = [
  { name: 'CCNA', color: '#2563eb' },
  { name: 'Wargame', color: '#dc2626' },
  { name: 'BashAcademy', color: '#16a34a' },
  { name: 'TOEIC', color: '#9333ea' }
];
const SUBJECT_COLORS = [
  '#2563eb', '#dc2626', '#16a34a', '#9333ea', '#ea580c',
  '#0891b2', '#d946ef', '#ca8a04', '#64748b', '#e11d48',
  '#059669', '#7c3aed', '#0284c7', '#db2777', '#65a30d'
];
const INTERVALS = { 1: 3, 2: 7, 3: 14, 4: 30, 5: 60, 6: 90, 7: Infinity };
const SYNC_PROFILE_BIN_ID = '698674a4d0ea881f40a6723a';

let topics = [];
let subjects = [...DEFAULT_SUBJECTS];
let activeFilter = 'All';
let searchQuery = '';
let selectedColor = SUBJECT_COLORS[0];
let currentView = 'list';
let calendarMonth = new Date().getMonth();
let calendarYear = new Date().getFullYear();
let calendarWeekStart = getMonday(new Date());
let selectedCalendarDay = null;
let undoStack = [];
let editingSubjectIndex = -1;
let editingSubjectColor = '';
let notificationsEnabled = false;
let settings = { masterKey: '$2a$10$6zzHCkKXNKTBhOGsHDRkeugNKF6XB4omyZ9qvOLMi0VpvL0UEb55C', accessKey: '$2a$10$jcULTdejTl/CbGpWn7/AieINUAEhPietikVHMbXMxcc1tMQjBmTbW', binId: '', autoSync: true };

// ── URL hash for binId persistence across browsers ──
function getBinIdFromHash() {
  const h = window.location.hash;
  if (h.startsWith('#bin=')) return h.slice(5);
  return '';
}
function setBinIdInHash(binId) {
  if (binId) window.location.hash = 'bin=' + binId;
}

// ── Init ──
function init() {
  loadTheme();
  loadSettings();
  const hashBin = getBinIdFromHash();
  if (hashBin && !settings.binId) {
    settings.binId = hashBin;
    saveSettingsToStorage();
  } else if (settings.binId) {
    setBinIdInHash(settings.binId);
  }
  loadSubjects();
  loadTopics();
  renderSubjectSelect();
  renderTabs();
  render();
  updateSyncStatus();
  updateStreak();
  loadNotificationState();
  checkNotifications();
}

// ── Theme ──
function loadTheme() {
  const t = localStorage.getItem('sr_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  updateThemeIcon();
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('sr_theme', next);
  updateThemeIcon();
}
function updateThemeIcon() {
  const t = document.documentElement.getAttribute('data-theme') || 'dark';
  document.getElementById('themeToggle').innerHTML = t === 'dark' ? '&#9789;' : '&#9728;';
}

// ── Storage ──
function loadSettings() {
  try { const s = localStorage.getItem('sr_settings'); if (s) settings = { ...settings, ...JSON.parse(s) }; } catch(e) {}
}
function saveSettingsToStorage() {
  localStorage.setItem('sr_settings', JSON.stringify(settings));
  setBinIdInHash(settings.binId);
}
function loadTopics() {
  try { const d = localStorage.getItem('sr_topics'); if (d) topics = JSON.parse(d); } catch(e) { topics = []; }
  if (settings.masterKey && settings.binId) pullFromCloud();
}
function saveTopics() {
  localStorage.setItem('sr_topics', JSON.stringify(topics));
  if (settings.masterKey && settings.autoSync) pushToCloud();
}
function loadSubjects() {
  try { const s = localStorage.getItem('sr_subjects'); if (s) subjects = JSON.parse(s); } catch(e) { subjects = [...DEFAULT_SUBJECTS]; }
}
function saveSubjects() {
  localStorage.setItem('sr_subjects', JSON.stringify(subjects));
  if (settings.masterKey && settings.autoSync) pushToCloud();
}

// ── Undo ──
function pushUndo(label) {
  undoStack.push({ label, topics: JSON.parse(JSON.stringify(topics)), subjects: JSON.parse(JSON.stringify(subjects)) });
  if (undoStack.length > 20) undoStack.shift();
}
function performUndo() {
  if (undoStack.length === 0) return;
  const snap = undoStack.pop();
  topics = snap.topics;
  subjects = snap.subjects;
  saveTopics();
  saveSubjects();
  renderSubjectSelect();
  renderTabs();
  render();
  toast('Undone: ' + snap.label);
}

// ── Custom Confirmation Dialog ──
let _confirmResolve = null;
function customConfirm(msg, detail, okLabel) {
  return new Promise(resolve => {
    _confirmResolve = resolve;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmDetail').textContent = detail || '';
    const okBtn = document.getElementById('confirmOkBtn');
    okBtn.textContent = okLabel || 'Delete';
    okBtn.className = (okLabel === 'Sync') ? 'btn-primary' : 'btn-danger';
    document.getElementById('confirmModal').classList.add('open');
  });
}
function confirmResolve(val) {
  document.getElementById('confirmModal').classList.remove('open');
  if (_confirmResolve) { _confirmResolve(val); _confirmResolve = null; }
}

// ── Sync User Profile ──
async function syncUserProfile() {
  const ok = await customConfirm(
    'Sync User Profile?',
    'This will connect to your cloud profile and load all your data. Any local-only data will be merged.',
    'Sync'
  );
  if (!ok) return;
  settings.binId = SYNC_PROFILE_BIN_ID;
  saveSettingsToStorage();
  updateSyncStatus();
  document.getElementById('binIdInput').value = settings.binId;
  toast('Syncing profile...');
  await pullFromCloud();
  toast('Profile synced!');
}

// ── Notifications ──
function loadNotificationState() {
  notificationsEnabled = localStorage.getItem('sr_notifications') === 'true';
  updateNotifButton();
}
function updateNotifButton() {
  const btn = document.getElementById('notifBtn');
  btn.style.borderColor = notificationsEnabled ? 'var(--accent)' : '';
  btn.style.color = notificationsEnabled ? 'var(--accent)' : '';
}
async function toggleNotifications() {
  if (!notificationsEnabled) {
    if (!('Notification' in window)) { toast('Browser does not support notifications'); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      notificationsEnabled = true;
      localStorage.setItem('sr_notifications', 'true');
      updateNotifButton();
      toast('Notifications enabled!');
      checkNotifications();
    } else {
      toast('Notification permission denied');
    }
  } else {
    notificationsEnabled = false;
    localStorage.setItem('sr_notifications', 'false');
    updateNotifButton();
    toast('Notifications disabled');
  }
}
function checkNotifications() {
  const overdueCount = topics.filter(t => categorize(t) === 'overdue').length;
  const todayCount = topics.filter(t => categorize(t) === 'today').length;
  const dueCount = overdueCount + todayCount;
  const badge = document.getElementById('notifBadge');
  badge.classList.toggle('show', dueCount > 0);

  if (notificationsEnabled && dueCount > 0 && Notification.permission === 'granted') {
    const lastNotif = localStorage.getItem('sr_last_notif');
    const now = today();
    if (lastNotif !== now) {
      new Notification('SR Tracker', {
        body: `You have ${dueCount} topic${dueCount > 1 ? 's' : ''} to review${overdueCount > 0 ? ` (${overdueCount} overdue!)` : ''}.`,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📚</text></svg>'
      });
      localStorage.setItem('sr_last_notif', now);
    }
  }
}
// Periodic check every 30 minutes
setInterval(() => { if (notificationsEnabled) checkNotifications(); }, 30 * 60 * 1000);

function getSubjectNames() { return subjects.map(s => s.name); }
function getSubjectColor(name) { const s = subjects.find(x => x.name === name); return s ? s.color : '#64748b'; }

function renderSubjectSelect() {
  const select = document.getElementById('subjectSelect');
  select.innerHTML = subjects.map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join('');
  if (activeFilter !== 'All' && subjects.find(s => s.name === activeFilter)) select.value = activeFilter;
}

// ── Subject modal ──
function openAddSubject() {
  selectedColor = SUBJECT_COLORS[0];
  editingSubjectIndex = -1;
  document.getElementById('subjectNameInput').value = '';
  renderColorGrid(); renderSubjectList();
  document.getElementById('addSubjectModal').classList.add('open');
  document.getElementById('subjectNameInput').focus();
}
function closeAddSubject() { document.getElementById('addSubjectModal').classList.remove('open'); editingSubjectIndex = -1; }

function renderSubjectList() {
  const list = document.getElementById('subjectList');
  let html = '';
  for (let i = 0; i < subjects.length; i++) {
    const s = subjects[i];
    if (i === editingSubjectIndex) {
      html += `<div class="subject-edit-form">
        <div class="subject-edit-top">
          <input type="text" id="editSubjectName" value="${escapeHtml(s.name)}" placeholder="Subject name">
        </div>
        <div class="subject-edit-colors">${SUBJECT_COLORS.map(c =>
          `<div class="mini-swatch${c === editingSubjectColor ? ' selected' : ''}" style="background:${c};" onclick="pickEditSubjectColor('${c}')"></div>`
        ).join('')}</div>
        <div class="subject-edit-actions">
          <button class="btn-cancel-edit" onclick="cancelEditSubject()">Cancel</button>
          <button class="btn-save-edit" onclick="saveSubjectEdit(${i})">Save</button>
        </div>
      </div>`;
    } else {
      html += '<div style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.6rem;background:var(--bg-input);border-radius:6px;font-size:0.85rem;">'
        + '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:' + s.color + ';flex-shrink:0;"></span>'
        + '<span style="flex:1;font-weight:500;">' + escapeHtml(s.name) + '</span>'
        + '<button onclick="startEditSubject(' + i + ')" style="background:#6c63ff;color:#fff;border:none;border-radius:4px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;">Edit</button>'
        + '<button onclick="deleteSubject(' + i + ')" style="background:#ef4444;color:#fff;border:none;border-radius:4px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;">Delete</button>'
        + '</div>';
    }
  }
  if (subjects.length === 0) {
    html = '<div style="padding:1rem;text-align:center;color:var(--text-dim);">No subjects yet</div>';
  }
  list.innerHTML = html;
  if (editingSubjectIndex >= 0) {
    const inp = document.getElementById('editSubjectName');
    if (inp) { inp.focus(); inp.select(); }
  }
}

function startEditSubject(i) {
  editingSubjectIndex = i;
  editingSubjectColor = subjects[i].color;
  renderSubjectList();
}
function cancelEditSubject() {
  editingSubjectIndex = -1;
  renderSubjectList();
}
function pickEditSubjectColor(c) {
  editingSubjectColor = c;
  renderSubjectList();
}
function saveSubjectEdit(i) {
  const nameEl = document.getElementById('editSubjectName');
  const newName = nameEl ? nameEl.value.trim() : '';
  if (!newName) { toast('Name cannot be empty'); return; }
  const oldName = subjects[i].name;
  // Check duplicate (allow same name if unchanged)
  if (newName.toLowerCase() !== oldName.toLowerCase() && subjects.find(s => s.name.toLowerCase() === newName.toLowerCase())) {
    toast('Subject name already exists'); return;
  }
  pushUndo('edit subject');
  // Update topics referencing old name
  if (newName !== oldName) {
    topics.forEach(t => { if (t.subject === oldName) t.subject = newName; });
  }
  subjects[i].name = newName;
  subjects[i].color = editingSubjectColor;
  editingSubjectIndex = -1;
  saveSubjects(); saveTopics();
  renderSubjectSelect(); renderSubjectList(); renderTabs(); render();
  toast(`Subject updated`);
}

async function deleteSubject(i) {
  const subj = subjects[i];
  const n = topics.filter(t => t.subject === subj.name).length;
  document.getElementById('addSubjectModal').classList.remove('open');
  const detail = n > 0
    ? `This subject has ${n} topic${n > 1 ? 's' : ''}. They will keep their current subject label but the subject will be removed from the list.`
    : 'This subject has no topics.';
  const ok = await customConfirm(`Delete "${subj.name}"?`, detail);
  if (!ok) { document.getElementById('addSubjectModal').classList.add('open'); renderSubjectList(); return; }
  pushUndo('delete subject');
  subjects.splice(i, 1);
  if (activeFilter === subj.name) activeFilter = 'All';
  saveSubjects(); renderSubjectSelect(); renderTabs(); render();
  toastWithUndo(`Subject "${subj.name}" deleted`);
}
async function deleteSubjectByName(name) {
  const i = subjects.findIndex(s => s.name === name);
  if (i === -1) return;
  await deleteSubject(i);
}

function renderColorGrid() {
  document.getElementById('colorGrid').innerHTML = SUBJECT_COLORS.map(c =>
    `<div class="color-swatch${c === selectedColor ? ' selected' : ''}" style="background:${c};" onclick="pickColor('${c}')"></div>`
  ).join('');
}
function pickColor(c) { selectedColor = c; renderColorGrid(); }
function confirmAddSubject() {
  const name = document.getElementById('subjectNameInput').value.trim();
  if (!name) { document.getElementById('subjectNameInput').focus(); return; }
  if (subjects.find(s => s.name.toLowerCase() === name.toLowerCase())) { toast('Already exists'); return; }
  pushUndo('add subject');
  subjects.push({ name, color: selectedColor });
  saveSubjects(); renderSubjectSelect(); renderSubjectList(); renderTabs(); render();
  document.getElementById('subjectSelect').value = name;
  document.getElementById('subjectNameInput').value = '';
  toast(`Subject "${name}" added`);
}

// ── Edit Topic ──
function openEditTopic(id) {
  const t = topics.find(x => x.id === id);
  if (!t) return;
  document.getElementById('editTopicId').value = id;
  document.getElementById('editTopicName').value = t.name;
  const sel = document.getElementById('editTopicSubject');
  sel.innerHTML = subjects.map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join('');
  sel.value = t.subject;
  document.getElementById('editTopicNotes').value = t.notes || '';
  document.getElementById('editTopicModal').classList.add('open');
  document.getElementById('editTopicName').focus();
}
function closeEditTopic() { document.getElementById('editTopicModal').classList.remove('open'); }
function saveEditTopic() {
  const id = document.getElementById('editTopicId').value;
  const t = topics.find(x => x.id === id);
  if (!t) return;
  pushUndo('edit topic');
  t.name = document.getElementById('editTopicName').value.trim() || t.name;
  t.subject = document.getElementById('editTopicSubject').value;
  t.notes = document.getElementById('editTopicNotes').value.trim();
  saveTopics(); renderTabs(); render(); closeEditTopic();
  toast('Topic updated');
}

// ── JSONBin API ──
async function pushToCloud() {
  if (!settings.masterKey) return;
  const dot = document.getElementById('syncDot'), label = document.getElementById('syncLabel');
  dot.className = 'sync-dot syncing'; label.textContent = 'Syncing...';
  const payload = { topics, subjects, updatedAt: new Date().toISOString() };
  const h = { 'X-Master-Key': settings.masterKey };
  if (settings.accessKey) h['X-Access-Key'] = settings.accessKey;
  try {
    let res;
    if (!settings.binId) {
      res = await fetch('https://api.jsonbin.io/v3/b', { method: 'POST', headers: { 'Content-Type': 'application/json', ...h, 'X-Bin-Name': 'sr-tracker' }, body: JSON.stringify(payload) });
    } else {
      res = await fetch(`https://api.jsonbin.io/v3/b/${settings.binId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', ...h }, body: JSON.stringify(payload) });
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
    if (!settings.binId && data.metadata) {
      settings.binId = data.metadata.id;
      saveSettingsToStorage();
      document.getElementById('binIdInput').value = settings.binId;
    }
    dot.className = 'sync-dot online'; label.textContent = 'Synced';
  } catch(e) {
    dot.className = 'sync-dot'; label.textContent = 'Sync error';
    console.error('Push failed:', e); toast('Sync failed: ' + e.message);
  }
}

async function pullFromCloud() {
  if (!settings.masterKey || !settings.binId) return;
  const h = { 'X-Master-Key': settings.masterKey };
  if (settings.accessKey) h['X-Access-Key'] = settings.accessKey;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${settings.binId}/latest`, { headers: h });
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || `HTTP ${res.status}`); }
    const data = await res.json();
    if (data.record) {
      if (data.record.topics && data.record.topics.length > 0) {
        const cloud = data.record.topics, ids = new Set(cloud.map(t => t.id));
        topics = [...cloud, ...topics.filter(t => !ids.has(t.id))];
        localStorage.setItem('sr_topics', JSON.stringify(topics));
      }
      if (data.record.subjects && data.record.subjects.length > 0) {
        const cs = data.record.subjects, cn = new Set(cs.map(s => s.name));
        subjects = [...cs, ...subjects.filter(s => !cn.has(s.name))];
        localStorage.setItem('sr_subjects', JSON.stringify(subjects));
        renderSubjectSelect();
      }
      renderTabs(); render();
    }
    updateSyncStatus();
  } catch(e) { console.error('Pull failed:', e); updateSyncStatus(); }
}

function updateSyncStatus() {
  const dot = document.getElementById('syncDot'), label = document.getElementById('syncLabel');
  if (settings.masterKey && settings.binId) { dot.className = 'sync-dot online'; label.textContent = 'Cloud'; }
  else if (settings.masterKey) { dot.className = 'sync-dot online'; label.textContent = 'Cloud (new)'; }
  else { dot.className = 'sync-dot'; label.textContent = 'Local'; }
}

// ── Streak ──
function updateStreak() {
  const allDates = new Set();
  topics.forEach(t => { if (t.history) t.history.forEach(h => allDates.add(h.date)); });
  let streak = 0, d = today();
  if (!allDates.has(d)) d = addDays(d, -1);
  while (allDates.has(d)) { streak++; d = addDays(d, -1); }
  const badge = document.getElementById('streakBadge');
  badge.innerHTML = streak > 0 ? `&#128293; ${streak}d` : '';
}

// ── Date helpers ──
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(dateStr, days) { const [y,m,d] = dateStr.split('-').map(Number); const dt = new Date(y, m-1, d+days); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function daysDiff(dateStr) { const [y,m,d] = dateStr.split('-').map(Number); const target = new Date(y, m-1, d); const now = new Date(); const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate()); return Math.round((target - todayDate) / 86400000); }
function formatDate(dateStr) {
  const diff = daysDiff(dateStr);
  if (diff < -1) return `${Math.abs(diff)}d overdue`;
  if (diff === -1) return 'Yesterday';
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff <= 7) return `In ${diff}d`;
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff);
  return dt.toISOString().split('T')[0];
}

// ── Topic operations ──
function addTopic() {
  const input = document.getElementById('topicInput'), name = input.value.trim();
  if (!name) { input.focus(); return; }
  const subject = document.getElementById('subjectSelect').value;
  pushUndo('add topic');
  topics.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, subject, level: 1, nextReview: addDays(today(), 1), history: [], createdAt: today(), notes: '' });
  input.value = ''; input.focus();
  saveTopics(); renderTabs(); render(); updateStreak(); checkNotifications();
  toastWithUndo(`Added "${name}"`);
}

function animateCard(id, callback) {
  const card = document.querySelector(`[data-id="${id}"]`);
  if (card) {
    card.classList.add('removing');
    setTimeout(callback, 280);
  } else {
    callback();
  }
}

function markSuccess(id) {
  const t = topics.find(x => x.id === id); if (!t) return;
  animateCard(id, () => {
    pushUndo('pass');
    t.history.push({ date: today(), result: 'pass', fromLevel: t.level });
    if (t.level < 7) { t.nextReview = addDays(today(), INTERVALS[t.level]); t.level++; }
    if (t.level === 7) t.nextReview = null;
    saveTopics(); renderTabs(); render(); updateStreak(); checkNotifications();
    toastWithUndo(`Passed "${t.name}"`);
  });
}
function markFail(id) {
  const t = topics.find(x => x.id === id); if (!t) return;
  animateCard(id, () => {
    pushUndo('fail');
    t.history.push({ date: today(), result: 'fail', fromLevel: t.level });
    t.level = 1; t.nextReview = addDays(today(), INTERVALS[1]);
    saveTopics(); renderTabs(); render(); updateStreak(); checkNotifications();
    toastWithUndo(`Failed "${t.name}"`);
  });
}
async function deleteTopic(id) {
  const t = topics.find(x => x.id === id); if (!t) return;
  const ok = await customConfirm(`Delete "${t.name}"?`, `This will remove the topic from ${t.subject}. You can undo this action.`);
  if (!ok) return;
  animateCard(id, () => {
    pushUndo('delete topic');
    topics = topics.filter(x => x.id !== id);
    saveTopics(); renderTabs(); render();
    toastWithUndo(`Deleted "${t.name}"`);
  });
}

function categorize(topic) {
  if (topic.level === 7) return 'mastered';
  const diff = daysDiff(topic.nextReview);
  if (diff < 0) return 'overdue';
  if (diff === 0) return 'today';
  if (diff <= 3) return 'soon';
  return 'later';
}

// ── View toggle ──
function setView(view) {
  currentView = view;
  document.getElementById('viewList').classList.toggle('active', view === 'list');
  document.getElementById('viewCalendar').classList.toggle('active', view === 'calendar');
  document.getElementById('viewWeek').classList.toggle('active', view === 'week');
  document.getElementById('viewRoadmap').classList.toggle('active', view === 'roadmap');

  document.getElementById('roadmapView').style.display = view === 'roadmap' ? '' : 'none';

  if (view === 'week') renderWeekView();
  if (view === 'roadmap') renderRoadmap();
}

// ── Calendar (Month) ──
function renderCalendar() {
  const container = document.getElementById('calendarView');
  const year = calendarYear, month = calendarMonth;
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startDow = firstDay.getDay();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const filtered = activeFilter === 'All' ? topics : topics.filter(t => t.subject === activeFilter);
  const dateMap = {};
  const todayStr = today();
  filtered.forEach(t => {
    if (t.level === 7 || !t.nextReview) return;
    const d = daysDiff(t.nextReview) < 0 ? todayStr : t.nextReview;
    if (!dateMap[d]) dateMap[d] = [];
    dateMap[d].push(t);
  });

  let html = `<div class="calendar-container"><div class="calendar-nav">
    <button onclick="calendarPrev()">&larr;</button>
    <span class="month-label">${monthNames[month]} ${year}</span>
    <button onclick="calendarNext()">&rarr;</button>
  </div><div class="calendar-grid">`;

  ['S','M','T','W','T','F','S'].forEach(d => { html += `<div class="calendar-day-header">${d}</div>`; });

  const prevDays = new Date(year, month, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) html += `<div class="calendar-day other-month"><span class="day-num">${prevDays - i}</span></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedCalendarDay;
    const dayTopics = dateMap[dateStr] || [];
    let dotsHtml = '';
    if (dayTopics.length > 0 && dayTopics.length <= 3) {
      dotsHtml = '<div class="day-dots">' + dayTopics.map(t => `<span class="day-dot" style="background:${getSubjectColor(t.subject)};"></span>`).join('') + '</div>';
    } else if (dayTopics.length > 3) {
      dotsHtml = `<span class="day-count">${dayTopics.length}</span>`;
    }
    const cls = `calendar-day${isToday ? ' today-cell' : ''}${isSelected ? ' selected-day' : ''}`;
    html += `<div class="${cls}" onclick="selectCalendarDay('${dateStr}')" title="${dayTopics.map(t=>t.name).join(', ')}"><span class="day-num">${d}</span>${dotsHtml}</div>`;
  }

  const remaining = (7 - ((startDow + daysInMonth) % 7)) % 7;
  for (let i = 1; i <= remaining; i++) html += `<div class="calendar-day other-month"><span class="day-num">${i}</span></div>`;

  html += '</div>';

  if (selectedCalendarDay && dateMap[selectedCalendarDay] && dateMap[selectedCalendarDay].length > 0) {
    const dayTopics = dateMap[selectedCalendarDay];
    html += `<div class="calendar-day-detail"><div class="detail-title">${formatDate(selectedCalendarDay)} - ${dayTopics.length} topic(s)</div>`;
    dayTopics.forEach(t => {
      html += `<div class="detail-item"><span class="topic-subject" style="background:${getSubjectColor(t.subject)};">${escapeHtml(t.subject)}</span> ${escapeHtml(t.name)} <span style="color:var(--text-dim);font-size:0.7rem;">Lv${t.level}/7</span></div>`;
    });
    html += '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

// ── Calendar (Week) ──
function renderWeekView() {
  const container = document.getElementById('calendarView');
  const filtered = activeFilter === 'All' ? topics : topics.filter(t => t.subject === activeFilter);
  const dateMap = {};
  const todayStr = today();
  filtered.forEach(t => {
    if (t.level === 7 || !t.nextReview) return;
    const d = daysDiff(t.nextReview) < 0 ? todayStr : t.nextReview;
    if (!dateMap[d]) dateMap[d] = [];
    dateMap[d].push(t);
  });

  const weekStart = calendarWeekStart;
  const weekDays = [];
  for (let i = 0; i < 7; i++) weekDays.push(addDays(weekStart, i));

  const startDate = new Date(weekStart + 'T00:00:00');
  const endDate = new Date(addDays(weekStart, 6) + 'T00:00:00');
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const rangeLabel = startDate.getMonth() === endDate.getMonth()
    ? `${startDate.getDate()} - ${endDate.getDate()} ${monthNames[startDate.getMonth()]} ${startDate.getFullYear()}`
    : `${startDate.getDate()} ${monthNames[startDate.getMonth()]} - ${endDate.getDate()} ${monthNames[endDate.getMonth()]} ${endDate.getFullYear()}`;

  let html = `<div class="calendar-container"><div class="calendar-nav">
    <button onclick="weekPrev()">&larr;</button>
    <span class="month-label">${rangeLabel}</span>
    <button onclick="weekNext()">&rarr;</button>
  </div>`;

  // Day headers
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  html += '<div class="week-grid">';
  dayNames.forEach(d => { html += `<div class="calendar-day-header">${d}</div>`; });

  // Day cells
  weekDays.forEach(dateStr => {
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedCalendarDay;
    const dayTopics = dateMap[dateStr] || [];
    const d = new Date(dateStr + 'T00:00:00').getDate();
    let cls = `week-day-cell${isToday ? ' today-cell' : ''}${isSelected ? ' selected-day' : ''}`;
    let topicsHtml = '';
    const maxShow = 4;
    dayTopics.slice(0, maxShow).forEach(t => {
      topicsHtml += `<div class="wk-topic" style="background:${getSubjectColor(t.subject)};">${escapeHtml(t.name)}</div>`;
    });
    if (dayTopics.length > maxShow) {
      topicsHtml += `<div style="font-size:0.6rem;color:var(--text-dim);">+${dayTopics.length - maxShow} more</div>`;
    }
    html += `<div class="${cls}" onclick="selectCalendarDay('${dateStr}');renderWeekView();">
      <div class="wk-date">${d}</div>${topicsHtml}
    </div>`;
  });
  html += '</div>';

  // Detail panel
  if (selectedCalendarDay && dateMap[selectedCalendarDay] && dateMap[selectedCalendarDay].length > 0) {
    const dayTopics = dateMap[selectedCalendarDay];
    html += `<div class="calendar-day-detail"><div class="detail-title">${formatDate(selectedCalendarDay)} - ${dayTopics.length} topic(s)</div>`;
    dayTopics.forEach(t => {
      html += `<div class="detail-item"><span class="topic-subject" style="background:${getSubjectColor(t.subject)};">${escapeHtml(t.subject)}</span> ${escapeHtml(t.name)} <span style="color:var(--text-dim);font-size:0.7rem;">Lv${t.level}/7</span></div>`;
    });
    html += '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

function selectCalendarDay(dateStr) {
  selectedCalendarDay = selectedCalendarDay === dateStr ? null : dateStr;
  if (currentView === 'calendar') renderCalendar();
}
function calendarPrev() { calendarMonth--; if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; } selectedCalendarDay = null; renderCalendar(); }
function calendarNext() { calendarMonth++; if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; } selectedCalendarDay = null; renderCalendar(); }
function weekPrev() { calendarWeekStart = addDays(calendarWeekStart, -7); selectedCalendarDay = null; renderWeekView(); }
function weekNext() { calendarWeekStart = addDays(calendarWeekStart, 7); selectedCalendarDay = null; renderWeekView(); }

// ── Roadmap ──
function renderRoadmap() {
  const container = document.getElementById('roadmapView');
  const filtered = activeFilter === 'All' ? [...topics] : topics.filter(t => t.subject === activeFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered.splice(0, filtered.length, ...filtered.filter(t => t.name.toLowerCase().includes(q) || t.subject.toLowerCase().includes(q)));
  }

  const levels = [1, 2, 3, 4, 5, 6, 7];
  const levelNames = { 1: 'Lv 1', 2: 'Lv 2', 3: 'Lv 3', 4: 'Lv 4', 5: 'Lv 5', 6: 'Lv 6', 7: 'Mastered' };
  const levelColors = { 1: '#ef4444', 2: '#f59e0b', 3: '#f97316', 4: '#3b82f6', 5: '#8b5cf6', 6: '#6366f1', 7: '#22c55e' };
  const levelIntervals = { 1: '1d', 2: '3d', 3: '7d', 4: '14d', 5: '30d', 6: '60d', 7: 'Done' };

  const buckets = {};
  levels.forEach(l => { buckets[l] = []; });
  filtered.forEach(t => { if (buckets[t.level]) buckets[t.level].push(t); });

  let html = '<div class="roadmap-container"><div class="roadmap-pipeline">';

  levels.forEach((lv, idx) => {
    const items = buckets[lv];
    const color = levelColors[lv];

    if (idx > 0) html += '<div class="roadmap-arrow">&#8250;</div>';

    html += `<div class="roadmap-col">
      <div class="roadmap-col-header" style="background:${color};">
        ${levelNames[lv]}<span class="col-count">${items.length}</span>
      </div>
      <div class="roadmap-col-body">`;

    if (items.length === 0) {
      html += '<div style="text-align:center;padding:1rem 0.3rem;font-size:0.65rem;color:var(--text-dim);">Empty</div>';
    } else {
      items.forEach((t, i) => {
        const cat = lv === 7 ? '' : categorize(t);
        const statusCls = cat === 'overdue' ? ' ri-overdue' : cat === 'today' ? ' ri-today' : '';
        const dueText = lv === 7 ? '' : formatDate(t.nextReview);
        html += `<div class="roadmap-item${statusCls}" style="animation-delay:${i * 30}ms;" onclick="openEditTopic('${t.id}')" title="${escapeHtml(t.name)}">
          <div class="ri-name">${escapeHtml(t.name)}</div>
          <span class="ri-subject" style="background:${getSubjectColor(t.subject)};">${escapeHtml(t.subject)}</span>
          ${dueText ? `<div class="ri-due">${dueText}</div>` : ''}
        </div>`;
      });
    }

    html += '</div></div>';
  });

  html += '</div>';

  // Summary bar
  const total = filtered.length;
  if (total > 0) {
    html += '<div style="display:flex;gap:2px;margin-top:0.6rem;border-radius:4px;overflow:hidden;height:8px;">';
    levels.forEach(lv => {
      const pct = (buckets[lv].length / total) * 100;
      if (pct > 0) html += `<div style="width:${pct}%;background:${levelColors[lv]};" title="Lv${lv}: ${buckets[lv].length}"></div>`;
    });
    html += '</div>';
    html += `<div style="display:flex;justify-content:space-between;font-size:0.65rem;color:var(--text-dim);margin-top:0.3rem;">
      <span>${total} topic${total !== 1 ? 's' : ''}</span>
      <span>${buckets[7].length} mastered (${total > 0 ? Math.round((buckets[7].length / total) * 100) : 0}%)</span>
    </div>`;
  }

  html += '</div>';
  container.innerHTML = html;
}

// ── Render ──
function renderTabs() {
  const container = document.getElementById('tabs');
  const names = getSubjectNames();
  const counts = { All: topics.length };
  names.forEach(s => { counts[s] = topics.filter(t => t.subject === s).length; });
  container.innerHTML = ['All', ...names].map(s => {
    const isAll = s === 'All', color = isAll ? 'var(--accent)' : getSubjectColor(s), isActive = activeFilter === s;
    const bgStyle = isActive ? `background:${color};border-color:${color};` : '';
    const delBtn = !isAll ? `<span class="tab-del" onclick="event.stopPropagation();deleteSubjectByName('${escapeHtml(s).replace(/'/g, "\\'")}')">&times;</span>` : '';
    return `<button class="tab${isActive ? ' active' : ''}" style="${bgStyle}" onclick="setFilter('${escapeHtml(s).replace(/'/g, "\\'")}')">
      ${!isAll ? `<span class="color-dot" style="background:${isActive ? '#fff' : color};"></span>` : ''}${escapeHtml(s)}<span class="count">${counts[s]}</span>${delBtn}</button>`;
  }).join('');
}

function setFilter(f) {
  activeFilter = f;
  if (f !== 'All' && subjects.find(s => s.name === f)) document.getElementById('subjectSelect').value = f;
  renderTabs(); render();
}

function renderSubjectStats() {
  const container = document.getElementById('subjectStats');
  container.innerHTML = subjects.map(s => {
    const count = topics.filter(t => t.subject === s.name).length;
    const overdue = topics.filter(t => t.subject === s.name && categorize(t) === 'overdue').length;
    const mastered = topics.filter(t => t.subject === s.name && t.level === 7).length;
    const pct = count > 0 ? Math.round((mastered / count) * 100) : 0;
    return `<div class="subject-stat">
      <span class="ss-dot" style="background:${s.color};"></span>
      ${escapeHtml(s.name)}: <span class="ss-count">${count}</span>
      ${overdue > 0 ? `<span style="color:var(--overdue);">(${overdue}!)</span>` : ''}
      <div class="ss-progress"><div class="ss-progress-fill" style="width:${pct}%;background:${s.color};"></div></div>
      <span style="font-size:0.6rem;color:var(--mastered);">${pct}%</span>
    </div>`;
  }).join('');
}

function render() {
  let filtered = activeFilter === 'All' ? [...topics] : topics.filter(t => t.subject === activeFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(t => t.name.toLowerCase().includes(q) || t.subject.toLowerCase().includes(q));
  }
  const groups = { overdue: [], today: [], soon: [], later: [], mastered: [] };
  filtered.forEach(t => { groups[categorize(t)].push(t); });
  groups.overdue.sort((a, b) => daysDiff(a.nextReview) - daysDiff(b.nextReview));
  groups.today.sort((a, b) => a.name.localeCompare(b.name));
  groups.soon.sort((a, b) => daysDiff(a.nextReview) - daysDiff(b.nextReview));
  groups.later.sort((a, b) => daysDiff(a.nextReview) - daysDiff(b.nextReview));
  groups.mastered.sort((a, b) => a.name.localeCompare(b.name));

  const allGroups = { overdue: 0, today: 0, soon: 0, mastered: 0 };
  topics.forEach(t => { const c = categorize(t); if (allGroups[c] !== undefined) allGroups[c]++; });
  document.getElementById('statOverdue').textContent = allGroups.overdue;
  document.getElementById('statToday').textContent = allGroups.today;
  document.getElementById('statSoon').textContent = allGroups.soon;
  document.getElementById('statMastered').textContent = allGroups.mastered;

  renderSubjectStats();

  const container = document.getElementById('topicList');
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">&#128218;</div><p>${searchQuery ? 'No matching topics' : 'No topics yet. Add one above!'}</p></div>`;
    if (currentView === 'calendar') renderCalendar();
    if (currentView === 'week') renderWeekView();
    if (currentView === 'roadmap') renderRoadmap();
    return;
  }
  let html = '';
  let cardIndex = 0;
  [{ key: 'overdue', label: 'Overdue', cls: 'overdue' }, { key: 'today', label: 'Due Today', cls: 'today' }, { key: 'soon', label: 'Coming Soon', cls: 'soon' }, { key: 'later', label: 'Later', cls: 'later' }, { key: 'mastered', label: 'Mastered', cls: 'mastered' }].forEach(sec => {
    if (groups[sec.key].length === 0) return;
    html += `<div class="section-header ${sec.cls}"><span class="dot"></span>${sec.label} (${groups[sec.key].length})</div>`;
    groups[sec.key].forEach(t => { html += renderCard(t, sec.key, cardIndex++); });
  });
  container.innerHTML = html;
  if (currentView === 'calendar') renderCalendar();
  if (currentView === 'week') renderWeekView();
  if (currentView === 'roadmap') renderRoadmap();
}

function renderCard(t, category, index) {
  const subjColor = getSubjectColor(t.subject);
  const cardClass = { overdue: 'overdue', today: 'due-today', soon: 'due-soon', mastered: 'mastered-card' }[category] || '';
  const pips = Array.from({ length: 7 }, (_, i) => `<span class="${t.level === 7 ? 'pip mastered-pip' : (i < t.level ? 'pip filled' : 'pip')}"></span>`).join('');
  const dateStr = t.level === 7 ? 'Mastered' : formatDate(t.nextReview);
  const sessions = t.history ? t.history.length : 0;
  const delay = Math.min(index * 30, 300);
  return `<div class="topic-card ${cardClass}" data-id="${t.id}" style="animation-delay:${delay}ms;">
    <div class="topic-info">
      <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
        <span class="topic-subject" style="background:${subjColor};">${escapeHtml(t.subject)}</span>
        <span class="topic-name">${escapeHtml(t.name)}</span>
      </div>
      <div class="topic-meta"><span>Lv ${t.level}/7</span><span>${dateStr}</span><span>${sessions} session${sessions !== 1 ? 's' : ''}</span></div>
      ${t.notes ? `<div class="topic-notes">${escapeHtml(t.notes)}</div>` : ''}
      <div class="level-pips" style="margin-top:0.3rem;">${pips}</div>
    </div>
    <div class="topic-actions">
      ${t.level !== 7 ? `<button class="btn-pass" onclick="markSuccess('${t.id}')">Pass</button><button class="btn-fail" onclick="markFail('${t.id}')">Fail</button>` : ''}
      <button class="btn-edit" onclick="openEditTopic('${t.id}')" title="Edit">&#9998;</button>
      <button class="btn-del" onclick="deleteTopic('${t.id}')" title="Delete">&times;</button>
    </div>
  </div>`;
}

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

// ── Settings ──
function openSettings() {
  document.getElementById('masterKeyInput').value = settings.masterKey;
  document.getElementById('accessKeyInput').value = settings.accessKey;
  document.getElementById('binIdInput').value = settings.binId;
  document.getElementById('autoSyncCheckbox').checked = settings.autoSync;
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
function saveSettings() {
  settings.masterKey = document.getElementById('masterKeyInput').value.trim();
  settings.accessKey = document.getElementById('accessKeyInput').value.trim();
  settings.binId = document.getElementById('binIdInput').value.trim();
  settings.autoSync = document.getElementById('autoSyncCheckbox').checked;
  saveSettingsToStorage(); updateSyncStatus(); closeSettings(); toast('Settings saved');
  if (settings.masterKey) { settings.binId ? pullFromCloud() : pushToCloud(); }
}

// ── Export / Import ──
function exportData() {
  const blob = new Blob([JSON.stringify({ topics, subjects, settings: { binId: settings.binId }, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `sr-tracker-${today()}.json`; a.click();
  toast('Exported');
}
function importData(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.topics && Array.isArray(data.topics)) {
        pushUndo('import');
        topics = data.topics;
        if (data.subjects && Array.isArray(data.subjects)) { subjects = data.subjects; saveSubjects(); renderSubjectSelect(); }
        saveTopics(); renderTabs(); render(); toast(`Imported ${topics.length} topics`);
      } else { toast('Invalid file'); }
    } catch(err) { toast('Parse error'); }
  };
  reader.readAsText(file); event.target.value = '';
}

// ── Toast ──
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
function toastWithUndo(msg) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${escapeHtml(msg)}</span><button class="undo-btn" onclick="performUndo();this.parentElement.remove();">Undo</button>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

// ── Events ──
document.getElementById('topicInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTopic(); });
document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; render(); });
document.getElementById('settingsModal').addEventListener('click', function(e) { if (e.target === this) closeSettings(); });
document.getElementById('addSubjectModal').addEventListener('click', function(e) { if (e.target === this) closeAddSubject(); });
document.getElementById('editTopicModal').addEventListener('click', function(e) { if (e.target === this) closeEditTopic(); });
document.getElementById('confirmModal').addEventListener('click', function(e) { if (e.target === this) confirmResolve(false); });
document.getElementById('subjectNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') confirmAddSubject(); });
document.getElementById('editTopicName').addEventListener('keydown', e => { if (e.key === 'Enter') saveEditTopic(); });

init();
</script>
